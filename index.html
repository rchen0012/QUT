<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
    <title>DAFU 库存盘点系统 · 库位扫码优化</title>
    <style>
        /* ===== 全局样式 ===== */
        :root {
            --mint: #37BEB0;
            --dark: #238F84;
            --line: #CDE9E4;
            --bg: #EAF6F3;
            --red: #c73545;
            --green: #087b38;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            font-family: system-ui, 'Microsoft YaHei', sans-serif;
            color: #18283e;
        }
        button, input { font: inherit; }
        button { cursor: pointer; }
        .app {
            max-width: 540px;
            min-height: 100vh;
            margin: auto;
            background: #fff;
            box-shadow: 0 0 25px #143a6412;
        }

        /* ===== 卡片与按钮基础 ===== */
        .card, .sheet {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            margin-top: 13px;
            border: 1px solid var(--line);
        }
        .sheet { box-shadow: 0 2px 10px #123b6420; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .muted, .hint { font-size: 12px; color: #637a7b; line-height: 1.6; }
        .primary {
            background: linear-gradient(90deg, #238F84, #37BEB0);
            color: white;
            border: 0;
            border-radius: 9px;
            padding: 12px;
            font-weight: 700;
        }
        .secondary {
            background: white;
            color: #167D73;
            border: 1px solid #B7E1D9;
            border-radius: 9px;
            padding: 10px;
        }
        .full { width: 100%; margin-top: 8px; }
        .hidden { display: none !important; }

        /* ===== 摄像头容器核心优化 ===== */
        #locationGate {
            background: #F0FAF8;
            border: 1px solid #C5EAE3;
            border-radius: 12px;
            padding: 14px;
        }
        #locationGate h3 { margin: 0 0 12px; font-size: 16px; }
        .inputrow {
            display: flex;
            gap: 7px;
        }
        .inputrow input {
            flex: 1;
            min-width: 0;
            border: 1px solid #a9c9c4;
            border-radius: 8px;
            padding: 12px;
            font-size: 17px;
        }
        .inputrow button {
            background: linear-gradient(90deg, #238F84, #37BEB0);
            color: white;
            border: 0;
            border-radius: 9px;
            padding: 12px;
            font-weight: 700;
        }
        .smallbuttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 9px;
        }
        .smallbuttons button { flex: 1; min-width: 95px; }

        /* --- 4:4 正方形摄像头取景框，限制最大尺寸 --- */
        #camera {
            display: block;
            width: 100%;
            max-width: 400px;          /* 限制最大宽度，避免大屏过宽 */
            margin: 14px auto 0;
            aspect-ratio: 1 / 1;       /* 强制正方形 4:4 */
            overflow: hidden;
            border-radius: 14px;
            background: #102b29;
            position: relative;
            border: 2px solid #37BEB0;  /* 增加边框感 */
            box-shadow: 0 4px 16px rgba(35, 143, 132, 0.2);
        }
        #camera.hidden { display: none !important; }

        #camera video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;   /* 裁剪填充正方形 */
            display: block;
        }

        /* 扫描框样式：内嵌在正方形里，用伪元素模拟 4:4 取景框 */
        #camera::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;                 /* 取景框占画面 85% 宽 */
            height: 85%;                /* 与宽度一致，维持 4:4 */
            border: 3px solid #37BEB0;
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 0 0 100vmax rgba(16, 43, 41, 0.35); /* 半透明遮罩效果 */
            z-index: 5;
        }

        /* 隐藏 html5-qrcode 自带的 shaded region 避免重复 */
        #camera #qr-shaded-region {
            display: none !important;
        }

        /* 小屏手机适配 */
        @media (max-width: 420px) {
            #camera {
                max-width: 100%;
                aspect-ratio: 1 / 1;
                border-radius: 12px;
            }
            #camera::after {
                width: 88%;
                height: 88%;
                border-width: 2px;
                border-radius: 10px;
            }
        }
        @media (max-width: 350px) {
            #camera::after {
                width: 90%;
                height: 90%;
            }
        }

        /* ===== 其他页面样式精简 ===== */
        .locationbar {
            margin-top: 12px;
            background: #eaf9f6;
            border: 1px solid #b7e1d9;
            border-radius: 10px;
            padding: 11px;
            margin-bottom: 12px;
        }
        .verified-location-code {
            font-size: 32px;
            font-weight: 800;
            color: #16877d;
            letter-spacing: 1px;
            margin: 8px 0 4px;
        }
        .pill {
            background: #dcf8ec;
            color: #137b48;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .notice.info { background: #eaf9f6; color: #167D73; padding: 11px; border-radius: 9px; margin: 10px 0; font-size: 13px; }
        .notice.success { background: #e5f8ed; color: #08672d; padding: 11px; border-radius: 9px; margin: 10px 0; font-size: 13px; }
        .dangerbutton { color: #b52c37; border-color: #edc5cb; }

        /* 步骤页面控制 —— 保持原有逻辑 */
        body.step-location #tab-scan > :not(#locationGate):not(#backHome) { display: none !important; }
        body.step-location .tabs { display: none !important; }
        body.step-location #locationGate { display: block !important; margin-top: 8px; }
        body.step-sku #locationGate { display: none !important; }
        body.step-sku #backHome { display: none !important; }
        body.step-sku #backLocationStep { display: block !important; }
        body.step-location #backHome { display: block !important; }
        body.step-home #backLocationStep { display: none !important; }
        .step-caption { font-size: 12px; font-weight: 750; color: #167d73; letter-spacing: .4px; margin: 0 0 12px; }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #173b3b;
            color: white;
            padding: 12px 16px;
            border-radius: 9px;
            display: none;
            z-index: 99;
            max-width: 90vw;
            font-size: 13px;
        }

        /* 模态框基础 */
        .modalshade {
            position: fixed;
            inset: 0;
            background: #091e3c9c;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            z-index: 50;
        }
        .modal {
            width: min(100%, 440px);
            max-height: 94vh;
            overflow: auto;
            background: #fff;
            border-radius: 15px;
            padding: 18px;
        }
        .modal h2 { font-size: 19px; margin: 0 0 12px; }
        .field { display: block; font-size: 13px; margin: 10px 0; color: #52667e; }
        .field input { display: block; width: 100%; padding: 11px; margin-top: 5px; border: 1px solid #b5c8de; border-radius: 8px; }
        .location-print-row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <!-- 简单骨架，只演示库位扫码步骤，摄像头区域已按 4:4 优化 -->
    <div class="app" style="padding:16px;">
        <h2 style="margin:0 0 6px;">📷 库位摄像头扫码 · 4:4 正方形取景</h2>
        <p class="hint">画面已限制最大宽度 400px，宽高比 1:1，内嵌扫描框，视觉更集中。</p>

        <!-- 模拟库位扫码区域，直接展示摄像头容器 -->
        <div id="locationGate" style="background:#F0FAF8;border:1px solid #C5EAE3;border-radius:12px;padding:14px;">
            <div class="step-caption">步骤 2 / 3 · 验证库位</div>
            <h3>① 先扫描库位码，解锁盘点</h3>
            <div class="inputrow">
                <input id="locationBarcode" placeholder="扫描库位二维码，例如 LOC:A1" type="text" autocomplete="off">
                <button id="confirmLocation">确认库位</button>
            </div>
            <div class="smallbuttons">
                <button class="secondary" id="locationCamera">📷 摄像头扫库位</button>
                <button class="secondary" id="changeLocation">↻ 更换库位</button>
            </div>
            <div class="notice info" id="locationGateStatus">尚未扫码库位，禁止商品盘点</div>

            <!-- 关键优化：摄像头容器 4:4 正方形，默认隐藏 -->
            <div id="camera" class="hidden">
                <!-- 模拟视频画面占位，实际由 html5-qrcode 注入 video -->
                <div style="width:100%;height:100%;background:#1a3e3a;display:flex;align-items:center;justify-content:center;color:#7fb9b0;font-size:13px;text-align:center;padding:20px;">
                    📷 摄像头预览区域<br>4:4 正方形
                </div>
            </div>
        </div>

        <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">
            <button class="secondary" id="demoShowCamera">显示摄像头区域（模拟）</button>
            <button class="secondary" id="demoHideCamera">隐藏摄像头区域</button>
        </div>
        <p class="hint" style="margin-top:12px;">实际使用时，html5-qrcode 会向 #camera 内注入 video 元素，object-fit: cover 保证画面填满正方形不拉伸。</p>
    </div>

    <script>
        // 简单演示：显示/隐藏摄像头区域
        const cameraEl = document.getElementById('camera');
        document.getElementById('demoShowCamera').addEventListener('click', () => {
            cameraEl.classList.remove('hidden');
        });
        document.getElementById('demoHideCamera').addEventListener('click', () => {
            cameraEl.classList.add('hidden');
        });

        // 模拟摄像头按钮点击（实际项目中会触发 html5-qrcode 初始化）
        document.getElementById('locationCamera').addEventListener('click', () => {
            cameraEl.classList.remove('hidden');
            // 这里可以添加实际的扫码初始化逻辑，但本文件仅展示布局优化
        });
    </script>
</body>
</html>
